<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="keys"><input id="display" type="text" readonly>


        <div>
            <button id="clear" onclick="clearDisplay()">AC</button>
            <button onclick="appendValue('.')">•</button>
            <button onclick="appendValue('%')">%</button>
            <button id="op" onclick="appendValue('+')">+</button>


        </div>

        <div><button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button id="op" onclick="appendValue('-')">-</button>



        </div>
        <div><button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button id="op" onclick="appendValue('*')">×</button>

        </div>
        <div><button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button id="op" onclick="appendValue('/')">÷</button>




        </div>
        <div>
            <button onclick="appendValue('0')">0</button>
            <button id="del" onclick="del('✕')">✕</button>
            <button id="eq" onclick="calculate('=')">=</button>
        </div>





    </div>
    <script src="scripts.js"></script>
</body>

</html>
