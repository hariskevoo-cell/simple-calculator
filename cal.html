<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100vh;
        }


        #all {
            gap: 10px;
            display: grid;
            grid-template-columns: repeat(4, );




        }

        p {
            margin-left: 170px;
        }

        #operator {
            background-color: rgb(89, 85, 85);
        }

        #div1 {

            margin-top: 20px;

        }

        button {
            button:hover {
                background-color: rgb(95, 8, 8);
            }

            background-color: rgb(72, 136, 115);
            height: 100px;
            width: 100px;
            border-radius: 360px;
            color: rgb(30, 3, 3);
            font-size: 3rem;
        }

        input {
            color: aliceblue;
            border-radius: 30px;
            background-color: rgba(22, 2, 2, 0.955);
            border: rgb(213, 206, 206);

            width: 100%;
            height: 100px;
        }

        #enter {
            text-align: right;
            font-size: 3rem;
            font-family: bold;
            font-display: auto;
        }
    </style>
</head>

<body>

    <div id="all">
        <input id="enter" type="text" readonly>
        <div id="div1">
            <button onclick="ac()">AC</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button onclick="appendValue('%')">%</button>
            <button id="operator" onclick="appendValue('/')">÷</button>

        </div>
        <div>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button id="operator" onclick="appendValue('*')">×</button>
        </div>
        <div>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button id="operator" onclick="appendValue('-')">–</button>
        </div>
        <div>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button id="operator" onclick="appendValue('+')">+</button>
        </div>
        <div>

            <button onclick="appendValue('0')">0</button>
            <button id="operator" onclick="appendValue('.')">•</button>
            <button id="operator" onclick="del()">✕</button>
            <button id="operator" onclick="calculate()">=</button>
        </div>
    </div>

    <script>

        const enter = document.getElementById('enter')
        function appendValue(value) {
            enter.value += value;

        }

        function ac() {
            enter.value = '';

        }

        function del() {
            enter.value = enter.value.slice(0, -1);
        }

        function calculate() {
            try {
                enter.value = eval(enter.value)
            }
            catch (error) {
                enter.value = 'syntax error';

            }
        }
    </script>


</body>


</html>
